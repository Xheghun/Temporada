appId: com.cremedigital.seasonalworker.e2e
name: Switch the shared phone identity
---
- openLink: temporada-e2e://identity
- tapOn:
    id: identity-switch-worker
- extendedWaitUntil:
    visible:
      id: worker-${WORKER_ID}
    timeout: 15000
- tapOn:
    id: worker-${WORKER_ID}
- extendedWaitUntil:
    visible:
      id: home-assignment
    timeout: 20000
- assertVisible: ${WORKER_NAME}
- takeScreenshot: selected-worker
