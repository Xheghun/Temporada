name: E2E driver compatibility
on:
  pull_request:
    paths:
      - '.github/workflows/e2e-compatibility.yml'
      - '.maestro/probe-*.yaml'
      - 'testing/e2e/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Maestro distribution
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { maestro } = JSON.parse(readFileSync('testing/e2e/toolchain.json', 'utf8'));
          const response = await fetch(maestro.url);
          if (!response.ok) throw new Error(`Download failed: ${response.status}`);
          const archive = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(archive).digest('hex') !== maestro.sha256) throw new Error('Maestro checksum mismatch');
          writeFileSync(`${process.env.RUNNER_TEMP}/maestro.zip`, archive);
          JS
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe pinned Android driver
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          ANDROID_SERIAL: emulator-5554
          PROBE_API: ${{ matrix.api }}
          PROBE_OUTPUT: ${{ github.workspace }}/e2e-results/probe-${{ matrix.api }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          cores: 2
          avd-name: temporada-probe-${{ matrix.api }}
          emulator-build: '16428233'
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          script: node testing/e2e/probe-android.mjs
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-driver-api-${{ matrix.api }}
          path: e2e-results/
          retention-days: 14
          if-no-files-found: warn
