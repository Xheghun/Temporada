name: E2E bundled app bootstrap
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'plugins/**'
      - 'app.config.ts'
      - 'app.json'
      - 'package*.json'
      - 'testing/e2e/**'
      - '.maestro/**'
      - '.github/workflows/e2e-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Android build tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Build isolated bundled app
        run: node testing/e2e/build-android.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-apk
          path: e2e-results/temporada-e2e.apk*
          retention-days: 14
          if-no-files-found: error
  cold-start:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix mock-server
      - name: Download test APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-apk
          path: e2e-results/
      - name: Install pinned Maestro
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const { maestro } = JSON.parse(readFileSync('testing/e2e/toolchain.json', 'utf8'));
          const response = await fetch(maestro.url);
          if (!response.ok) throw new Error(`Download failed: ${response.status}`);
          const archive = Buffer.from(await response.arrayBuffer());
          if (createHash('sha256').update(archive).digest('hex') !== maestro.sha256) throw new Error('Maestro checksum mismatch');
          writeFileSync(`${process.env.RUNNER_TEMP}/maestro.zip`, archive);
          JS
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native offline cold start
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          ANDROID_SERIAL: emulator-5554
          E2E_OUTPUT: e2e-results/bootstrap-${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          avd-name: temporada-bootstrap-${{ matrix.api }}
          emulator-build: '16428233'
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -lowram
          script: node testing/e2e/bootstrap-android.mjs
      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundled-cold-start-api-${{ matrix.api }}
          path: e2e-results/bootstrap-${{ matrix.api }}/
          retention-days: 14
          if-no-files-found: warn
