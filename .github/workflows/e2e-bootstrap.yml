name: Android acceptance
on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'mock-server/**'
      - 'tsconfig.json'
      - 'plugins/**'
      - 'app.config.ts'
      - 'app.json'
      - 'package*.json'
      - 'testing/e2e/**'
      - '.maestro/**'
      - '.github/workflows/e2e-bootstrap.yml'
  push:
    branches: [main]
  schedule:
    - cron: '20 1 * * *'
    - cron: '20 3 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options:
          [
            smoke,
            full,
            foundation,
            acceptance,
            layouts,
            scenario,
            intentional-failure,
          ]
        default: smoke
      scenario:
        description: 'Individual scenario or regression ID'
        type: string
        default: '2'
      apk_run_id:
        description: 'Existing APK run for driver debugging only; leave empty for acceptance'
        type: string
        default: ''
      camera_backend:
        description: 'Virtual camera backend for focused compatibility checks'
        type: choice
        options: [auto, emulated, imagefile, virtualscene]
        default: auto
      build_diagnostics:
        description: 'Include Gradle dependency-resolution diagnostics'
        type: boolean
        default: false
      api:
        type: choice
        options: ['34', '28', both]
        default: '34'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.apk_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Android build tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Build isolated bundled app
        env:
          E2E_BUILD_DIAGNOSTICS: ${{ inputs.build_diagnostics && '1' || '0' }}
        run: node testing/e2e/build-android.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-apk
          path: e2e-results/temporada-e2e.apk*
          retention-days: 14
          if-no-files-found: error
  android:
    name: ${{ inputs.apk_run_id != '' && format('Driver debug {0} (API {1})', inputs.suite == 'scenario' && inputs.scenario || inputs.suite, matrix.api) || format('Android {0} (API {1}, {2})', inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'full'), matrix.api, matrix.acceptanceGroup) }}
    needs: build
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || inputs.apk_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.api == 'both' && '[28,34]' || format('[{0}]', inputs.api)) || github.event.schedule == '20 3 * * 0' && '[28]' || '[34]') }}
        acceptanceGroup: ${{ fromJSON(inputs.suite == 'acceptance' && '["individual","full-first","full-second","regressions","layouts","measurements"]' || '["all"]') }}
        exclude:
          - api: 34
            acceptanceGroup: measurements
    steps:
      - name: Validate virtual camera choice
        if: ${{ matrix.api == 28 && inputs.camera_backend == 'imagefile' }}
        run: |
          echo 'The selected virtual camera backend is unsupported by this pinned emulator.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix mock-server
      - name: Download test APK
        if: ${{ !inputs.apk_run_id }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-apk
          path: e2e-results/
      - name: Reuse APK for driver debugging
        if: ${{ inputs.apk_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-apk
          path: e2e-results/
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Install pinned Maestro
        run: node testing/e2e/install-maestro.mjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare unrelated mock-data sentinel
        run: |
          mkdir -p mock-server/.data
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('mock-server/.data/unrelated-fixture.txt', 'fictional normal mock data', {flag:'wx'});"
      - name: Run installed app journeys
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          ANDROID_SERIAL: emulator-5554
          E2E_OUTPUT: e2e-results/native-${{ matrix.api }}
          E2E_SUITE: ${{ inputs.suite || (github.event_name == 'pull_request' && 'smoke' || 'full') }}
          E2E_SELECTED_SCENARIO: ${{ inputs.scenario }}
          E2E_REUSED_APK_RUN: ${{ inputs.apk_run_id }}
          E2E_API: ${{ matrix.api }}
          E2E_CAMERA_BACKEND: ${{ inputs.camera_backend == 'emulated' && 'emulated' || (inputs.camera_backend == 'virtualscene' || (matrix.api == 28 && inputs.camera_backend != 'imagefile')) && 'virtualscene' || 'imagefile' }}
          E2E_ACCEPTANCE_GROUP: ${{ matrix.acceptanceGroup }}
          E2E_PROTECTED_FIXTURE: '1'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          avd-name: temporada-bootstrap-${{ matrix.api }}
          emulator-build: ${{ matrix.api == 28 && '13610412' || '16428233' }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 ${{ matrix.api == 34 && '-lowram' || '' }} ${{ (matrix.acceptanceGroup == 'layouts' || inputs.suite == 'layouts') && '-skin 360x720' || '' }} -camera-back ${{ inputs.camera_backend == 'emulated' && 'emulated' || (inputs.camera_backend == 'virtualscene' || (matrix.api == 28 && inputs.camera_backend != 'imagefile')) && 'virtualscene' || format('imagefile:{0}/e2e-results/camera-feed.png', github.workspace) }} -camera-front none
          pre-emulator-launch-script: node testing/e2e/prepare-emulator.mjs
          script: |
            adb install e2e-results/isolation-fixture.apk
            adb shell am start -W -n com.cremedigital.seasonalworker/.IsolationFixture
            node testing/e2e/ci-android.mjs
      - name: Filter native diagnostic logs
        if: always()
        env:
          E2E_OUTPUT: e2e-results/native-${{ matrix.api }}
        run: node testing/e2e/sanitize-artifacts.mjs
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-acceptance-api-${{ matrix.api }}-${{ matrix.acceptanceGroup }}
          path: e2e-results/native-${{ matrix.api }}/
          retention-days: 14
          if-no-files-found: warn
