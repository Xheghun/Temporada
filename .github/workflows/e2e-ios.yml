name: iOS smoke
on:
  pull_request:
    paths:
      - '.github/workflows/e2e-ios.yml'
      - 'testing/e2e/build-ios.mjs'
      - 'testing/e2e/ios-smoke.mjs'
      - '.maestro/ios-*.yaml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix mock-server
      - name: Install pinned Maestro
        run: node testing/e2e/install-maestro.mjs
      - name: Build bundled simulator application
        run: node testing/e2e/build-ios.mjs
      - name: Run the iOS smoke subset
        env:
          E2E_OUTPUT: e2e-results/ios-smoke
        run: node testing/e2e/ios-smoke.mjs
      - name: Upload iOS smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-smoke
          path: |
            e2e-results/ios-smoke/
            e2e-results/temporada-e2e-ios.tar.gz.json
          retention-days: 14
          if-no-files-found: warn
