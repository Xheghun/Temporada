name: iOS smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-e2e-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify selected Xcode
        run: xcodebuild -version
      - run: npm ci
      - run: npm ci --prefix mock-server
      - name: Install pinned Maestro
        run: node testing/e2e/install-maestro.mjs
      - name: Build bundled simulator application
        run: node testing/e2e/build-ios.mjs
      - name: Retain bundled simulator application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-e2e-app
          path: e2e-results/temporada-e2e-ios.tar.gz*
          retention-days: 14
          if-no-files-found: error
      - name: Run the iOS smoke subset
        env:
          E2E_OUTPUT: e2e-results/ios-smoke
        run: node testing/e2e/ios-smoke.mjs
      - name: Filter simulator diagnostic logs
        if: always()
        env:
          E2E_OUTPUT: e2e-results/ios-smoke
        run: node testing/e2e/sanitize-artifacts.mjs
      - name: Upload iOS smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-smoke
          path: |
            e2e-results/ios-smoke/
            e2e-results/temporada-e2e-ios.tar.gz.json
          retention-days: 14
          if-no-files-found: warn
